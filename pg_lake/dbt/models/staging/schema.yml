version: 2

models:
  - name: stg_orders
    description: Staging view for orders from raw Iceberg table
    columns:
      - name: order_id
        description: Primary key for orders
        tests:
          - unique
          - not_null
      - name: customer_id
        description: Foreign key to customer
        tests:
          - not_null
      - name: order_date
        description: Timestamp when the order was placed
      - name: order_status
        description: Current status of the order

  - name: stg_bought_products
    description: Staging view for bought products from raw Iceberg table
    columns:
      - name: bought_product_id
        description: Primary key for bought products
        tests:
          - unique
          - not_null
      - name: product_id
        description: Foreign key to product
        tests:
          - not_null
      - name: product_customizations
        description: Array of customization IDs
      - name: order_id
        description: Foreign key to order
        tests:
          - not_null


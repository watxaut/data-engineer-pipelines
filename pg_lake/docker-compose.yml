services:
  # MinIO - S3 compatible object storage
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reverse-etl-network

  # MinIO Client - for bucket creation and data initialization
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/warehouse --ignore-existing;
      mc mb myminio/iceberg --ignore-existing;
      echo 'MinIO buckets created successfully';
      "
    networks:
      - reverse-etl-network

  # Iceberg REST Catalog
  iceberg-rest:
    image: tabulario/iceberg-rest:latest
    container_name: iceberg-rest
    ports:
      - "8181:8181"
    environment:
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_ACCESS__KEY__ID: minioadmin
      CATALOG_S3_SECRET__ACCESS__KEY: minioadmin
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_S3_REGION: us-east-1
      AWS_REGION: us-east-1
    depends_on:
      minio-init:
        condition: service_completed_successfully
    networks:
      - reverse-etl-network

  # Trino - Query engine
  trino:
    image: trinodb/trino:latest
    container_name: trino
    ports:
      - "8080:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog
      - ./trino/config.properties:/etc/trino/config.properties
    depends_on:
      - iceberg-rest
      - minio
    networks:
      - reverse-etl-network

  # pgduck_server - DuckDB wire protocol server (runs first)
  pgduck-server:
    build:
      context: ./postgres-pglake
      dockerfile: Dockerfile
      target: pgduck_server
      args:
        - BASE_IMAGE_OS=almalinux
        - BASE_IMAGE_TAG=9
    container_name: pgduck-server
    volumes:
      - ./postgres-pglake/scripts/entrypoint-pgduck-server.sh:/entrypoint-pgduck-server.sh
      - ./postgres-pglake/scripts/init-pgduck-server.sql:/init-pgduck-server.sql
      - pgduck-unix-socket-volume:/tmp
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
    entrypoint: ["/entrypoint-pgduck-server.sh"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "psql", "-p", "5332", "-h", "/tmp", "-c", "SELECT 1;"]
      interval: 6s
      timeout: 2s
      start_period: 30s
      retries: 5
    cap_add:
      - SYS_PTRACE
    depends_on:
      - minio
    networks:
      - reverse-etl-network

  # PostgreSQL with pg_lake (communicates with pgduck-server via Unix socket)
  postgres-pglake:
    build:
      context: ./postgres-pglake
      dockerfile: Dockerfile
      target: pg_lake_postgres
      args:
        - BASE_IMAGE_OS=almalinux
        - BASE_IMAGE_TAG=9
    container_name: postgres-pglake
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-pglake/scripts/entrypoint-postgres.sh:/entrypoint-postgres.sh
      - ./postgres-pglake/scripts/init-postgres.sql:/init-postgres.sql
      - pgduck-unix-socket-volume:/tmp
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: analytics
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
    entrypoint: ["/entrypoint-postgres.sh"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "psql", "-U", "postgres", "-c", "SELECT 1;"]
      interval: 6s
      timeout: 2s
      start_period: 30s
      retries: 5
    cap_add:
      - SYS_PTRACE
    depends_on:
      pgduck-server:
        condition: service_healthy
    networks:
      - reverse-etl-network

  # Airflow PostgreSQL database
  airflow-postgres:
    image: postgres:15
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    networks:
      - reverse-etl-network

  # Airflow with dbt-trino
  airflow:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: airflow
    ports:
      - "8082:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: 'UKMzEm3yIuFYEq1y3-2FxPNWSVwRASpahmQ9kQfEr8E='
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
      TRINO_HOST: trino
      TRINO_PORT: 8080
      POSTGRES_HOST: postgres-pglake
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: analytics
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./dbt:/opt/airflow/dbt
      - airflow-logs:/opt/airflow/logs
    depends_on:
      airflow-postgres:
        condition: service_healthy
      trino:
        condition: service_started
      postgres-pglake:
        condition: service_healthy
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin || true &&
      airflow connections delete postgres_pglake || true &&
      airflow connections add postgres_pglake \
        --conn-type postgres \
        --conn-host postgres-pglake \
        --conn-schema analytics \
        --conn-login postgres \
        --conn-password postgres \
        --conn-port 5432 &&
      airflow webserver & airflow scheduler
      "
    networks:
      - reverse-etl-network

  # Python script for data initialization
  data-initializer:
    build:
      context: ./data-init
      dockerfile: Dockerfile
    container_name: data-initializer
    environment:
      TRINO_HOST: trino
      TRINO_PORT: 8080
      TRINO_USER: admin
    depends_on:
      - trino
      - iceberg-rest
    volumes:
      - ./data-init:/app
    command: python /app/initialize_data.py
    networks:
      - reverse-etl-network

volumes:
  minio-data:
  postgres-data:
  airflow-postgres-data:
  airflow-logs:
  pgduck-unix-socket-volume:
  pg-tmp-dir-volume:

networks:
  reverse-etl-network:
    driver: bridge

